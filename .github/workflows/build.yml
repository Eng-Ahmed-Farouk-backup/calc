name: Build and Release

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            output_name: main-linux
            asset_name: main-linux
            pyinstaller_args: --onefile
          - os: windows-latest
            output_name: main.exe
            asset_name: main-windows.exe
            pyinstaller_args: --onefile
          - os: macos-latest
            output_name: main-macos
            asset_name: main-macos
            pyinstaller_args: --onefile --target-architecture universal2

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Build with PyInstaller
      shell: bash
      run: |
        pyinstaller ${{ matrix.pyinstaller_args }} \
          --name ${{ matrix.output_name }} \
          main.py

    - name: Upload artifact (Linux)
      if: runner.os == 'Linux'
      uses: actions/upload-artifact@v4
      with:
        name: main-linux
        path: dist/main-linux

    - name: Upload artifact (Windows)
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: main-windows.exe
        path: dist/main.exe

    - name: Upload artifact (macOS)
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: main-macos
        path: dist/main-macos

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4

    - name: Make executables executable
      run: |
        chmod +x main-linux/main-linux || true
        chmod +x main-macos/main-macos || true

    - name: Create Release and Upload Assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          main-linux/main-linux
          main-windows.exe/main-windows.exe
          main-macos/main-macos
        generate_release_notes: true
        fail_on_unmatched_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
